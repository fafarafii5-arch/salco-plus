<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="description" content="سامانه مدیریت فروشگاه SALCO+" />
    <title>SALCO+ | مدیریت فروشگاه</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0b0b; color: #f4f1e8; font-family: Tahoma, sans-serif; }
      #startup-message { display: none; direction: rtl; max-width: 560px; margin: 12vh auto; padding: 24px; border: 1px solid #4b3d20; border-radius: 14px; background: #141414; line-height: 2; }
      #startup-message h1 { color: #d7b56d; margin-top: 0; }
      #startup-message code { overflow-wrap: anywhere; color: #f1d99a; }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var box = document.getElementById('startup-message');
        if (!box) return;
        box.style.display = 'block';
        box.innerHTML = '<h1>SALCO⁺</h1><p>برنامه در مرورگر بارگذاری نشد.</p><p><b>جزئیات خطا:</b></p><code></code>';
        box.querySelector('code').textContent = event.message || 'خطای بارگذاری فایل برنامه';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('startup-message');
        if (!box) return;
        box.style.display = 'block';
        box.innerHTML = '<h1>SALCO⁺</h1><p>برنامه هنگام اجرا با خطا روبه‌رو شد.</p><p><b>جزئیات خطا:</b></p><code></code>';
        box.querySelector('code').textContent = String(event.reason && (event.reason.message || event.reason) || 'خطای نامشخص');
      });
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var box = document.getElementById('startup-message');
        if (root && !root.hasChildNodes() && box) {
          box.style.display = 'block';
          box.innerHTML = '<h1>SALCO⁺</h1><p>صفحه برنامه خالی مانده است؛ فایل اصلی برنامه اجرا نشده یا بارگذاری آن مسدود شده.</p><p>لطفاً از همین صفحه عکس بفرستید تا خطا را دقیق‌تر مشخص کنیم.</p>';
        }
      }, 8000);
    </script>
  </head>
  <body>
    <div id="startup-message"><h1>SALCO⁺</h1><p>در حال بارگذاری برنامه…</p></div>
    <div id="root"></div>
    <noscript><div id="startup-message" style="display:block">برای اجرای برنامه، JavaScript باید در مرورگر فعال باشد.</div></noscript>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
