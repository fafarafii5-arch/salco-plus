name: SALCO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor and asset tools
        run: npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets --no-audit --no-fund

      - name: Configure Android app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.salco.plus",
            "appName": "SALCO Plus",
            "webDir": "dist"
          }
          EOF

      - name: Build web app for Android
        env:
          CAPACITOR_BUILD: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare SALCO logo for Android icon
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open("public/images/salco-logo.webp").convert("RGBA")
          # Place the real SALCO logo centered on a premium matte-black square.
          src.thumbnail((760, 760), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (1024, 1024), (11, 11, 11, 255))
          canvas.alpha_composite(src, ((1024-src.width)//2, (1024-src.height)//2))
          canvas.convert("RGB").save("assets/icon.png", quality=95)
          canvas.convert("RGB").save("assets/splash.png", quality=95)
          PY
          npx capacitor-assets generate --android

      - name: Sync app and branded assets into Android project
        run: npx cap sync android

      - name: Audit Android manifest and SDK compatibility
        run: |
          cd android
          chmod +x gradlew
          ./gradlew processDebugMainManifest
          echo "=== Android SDK configuration ==="
          grep -R -E 'minSdkVersion|targetSdkVersion|compileSdkVersion' app/build.gradle variables.gradle 2>/dev/null || true
          echo "=== Merged app permissions ==="
          MANIFEST="app/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -oE 'android.permission.[A-Z_]+' "$MANIFEST" | sort -u || true
          else
            find app/build/intermediates -name AndroidManifest.xml -type f -print
          fi
          echo "=== Basic check for common high-risk permissions ==="
          if [ -f "$MANIFEST" ] && grep -Eqi 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|BIND_DEVICE_ADMIN|MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "::warning::Sensitive permission found in merged manifest; review before distribution."
            grep -Eo 'android.permission.[A-Z_]+' "$MANIFEST" | sort -u
          else
            echo "No common high-risk permissions found by this basic check."
          fi

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload installable APK and manifest audit
        uses: actions/upload-artifact@v4
        with:
          name: SALCO-Plus-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 30
