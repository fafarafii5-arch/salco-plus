name: SALCO+ Build Check

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build SALCO+
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Check required files
    run: |
      echo "Checking SALCO+ project files..."
      test -f package.json || (echo "ERROR: package.json is missing" && exit 1)
      test -f index.html || (echo "ERROR: index.html is missing" && exit 1)
      test -f src/main.jsx || (echo "ERROR: src/main.jsx is missing" && exit 1)
      test -f src/styles.css || (echo "ERROR: src/styles.css is missing" && exit 1)
      echo "Required files found."

  - name: Check Node and npm versions
    run: |
      node --version
      npm --version

  - name: Install dependencies
    run: npm install --no-audit --no-fund

  - name: Build project
    run: npm run build
